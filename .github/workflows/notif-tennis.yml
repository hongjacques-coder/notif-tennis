name: notif-tennis

on:
  # Chaque run boucle ~5h40 (vérif toutes les 5 min) puis relance le suivant.
  # Ce cron ne sert que de filet de sécurité pour redémarrer la chaîne si elle casse.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: # bouton "Run workflow" pour lancer à la main
    inputs:
      test_discord:
        description: "Envoyer un message de test sur Discord"
        type: boolean
        default: false

concurrency:
  group: notif-tennis
  cancel-in-progress: false

permissions:
  contents: write # pour recommiter seen.json
  actions: write  # pour relancer le run suivant et lire l'état du workflow

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tester le webhook Discord
        if: inputs.test_discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python notif_tennis.py --test

      - name: Vérifier les nouvelles parties
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python notif_tennis.py --boucle

      - name: Sauvegarder seen.json
        if: always()
        run: |
          git add seen.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git config user.name "notif-tennis-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "MAJ seen.json"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Relancer le run suivant
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f .relancer ] || exit 0
          gh workflow run notif-tennis.yml --ref "${GITHUB_REF_NAME}"
